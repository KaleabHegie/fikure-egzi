# Local development database only. Production uses the cPanel-managed MySQL/MariaDB.
services:
  db:
    image: mariadb:11.4
    container_name: fikure-egzi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${FE_DB_ROOT_PASSWORD:-fikure_root_dev}
      MARIADB_DATABASE: ${FE_DB_NAME:-fikure_egzi}
      MARIADB_USER: ${FE_DB_USER:-fikure}
      MARIADB_PASSWORD: ${FE_DB_PASSWORD:-fikure_dev_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${FE_DB_HOST_PORT:-3307}:3306'
    volumes:
      - fikure_egzi_db:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fikure_egzi_db:
