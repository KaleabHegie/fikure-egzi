
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cpanel
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        env:
          DATABASE_URL: mysql://build:build@localhost:3306/build
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Check API
        env:
          DATABASE_URL: mysql://build:build@localhost:3306/build
        working-directory: backend
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Check web app
        working-directory: frontend
        run: |
          npm run lint
          npx tsc -b --noEmit
          npx vitest run

  build:
    name: Build release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        env:
          DATABASE_URL: mysql://build:build@localhost:3306/build
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Build web and API bundles
        env:
          VITE_API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
          DATABASE_URL: mysql://build:build@localhost:3306/build
        run: scripts/build-release.sh

      - name: Package release
        run: tar -C deploy/build -czf cpanel-release.tar.gz api web

      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-release
          path: cpanel-release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy release
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-release

      - name: Configure SSH
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$CPANEL_SSH_PORT" -H "$CPANEL_SSH_HOST" \
            >> ~/.ssh/known_hosts

      - name: Upload release bundle
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          scp -P "$CPANEL_SSH_PORT" cpanel-release.tar.gz \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:~/fikure-egzi-release.tar.gz"

      - name: Activate release and restart API
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_API_ROOT: ${{ secrets.CPANEL_API_ROOT }}
          CPANEL_WEB_ROOT: ${{ secrets.CPANEL_WEB_ROOT }}
        run: |
          ssh -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "bash -s -- '$CPANEL_API_ROOT' '$CPANEL_WEB_ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          api_root="$1"
          web_root="$2"
          release_dir="$HOME/.fikure-egzi-release"

          # Extract the release.
          rm -rf "$release_dir"
          mkdir -p "$release_dir" "$api_root" "$web_root"
          tar -xzf "$HOME/fikure-egzi-release.tar.gz" -C "$release_dir"

          # Deploy API and frontend files.
          # Existing uploads outside the release remain untouched.
          cp -R "$release_dir/api/." "$api_root/"
          cp -R "$release_dir/web/." "$web_root/"

          cd "$api_root"

          # Activate the cPanel Node.js environment.
          # cPanel's activation script may reference unset variables.
          # Avoid cPanel activation script's CL_VIRTUAL_ENV error.
          set +u
          unset CL_VIRTUAL_ENV
          . "$HOME/nodevenv/fikure-api/22/bin/activate"
          set +u

          # Install production dependencies.
          npm ci --omit=dev

          # Use the environment variables set on cPanel's Node.js application page
          # (DATABASE_URL, SEED_ADMIN_*, ...), so migrations and the seed see
          # exactly what the running API sees.
          eval "$(node -e '
            const fs = require("fs");
            const path = process.env.HOME + "/.cl.selector/node-selector.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            const vars = config["fikure-api"]?.env_vars ?? {};

            if (!vars.DATABASE_URL) {
              console.error("DATABASE_URL is missing from the cPanel Node.js application");
              process.exit(1);
            }

            const quote = (v) => "\x27" + String(v).replace(/\x27/g, "\x27\\\x27\x27") + "\x27";
            for (const [name, value] of Object.entries(vars)) {
              if (/^[A-Z_][A-Z0-9_]*$/.test(name)) console.log(`export ${name}=${quote(value)}`);
            }
          ')"
          : "${DATABASE_URL:?Could not read the cPanel Node.js application settings}"

          if [ -z "${SEED_ADMIN_EMAIL:-}" ] || [ -z "${SEED_ADMIN_PASSWORD:-}" ]; then
            echo "::warning::SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD are not set on the cPanel app; no admin account will be created."
          fi

          # Apply database migrations and sync roles, permissions and reference data.
          npx prisma migrate deploy
          npm run db:seed

          # Restart the application through cPanel Passenger.
          mkdir -p tmp
          touch tmp/restart.txt

          # Remove the uploaded archive after successful deployment.
          rm -f "$HOME/fikure-egzi-release.tar.gz"
          REMOTE_SCRIPT
